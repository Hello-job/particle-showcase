name: Validate showcase and Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:skill
      - run: npm run build
      - run: npm run build:sites
      - run: npm run test:sites
      - run: npm run skill:check
      - run: npm run skill:pack
      - name: Validate standalone Skill template
        working-directory: skills/particle-showcase/assets/starter
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
