name: Validate showcase and Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:skill
      - run: pnpm build
      - run: pnpm build:sites
      - run: pnpm test:sites
      - run: pnpm skill:check
      - run: pnpm skill:pack
      - name: Export from the packaged Skill and repository
        run: |
          python3 -m zipfile -e deliverables/particle-showcase-skill.zip "$RUNNER_TEMP/particle-skill"
          python3 "$RUNNER_TEMP/particle-skill/particle-showcase/scripts/create_showcase.py" --source "$GITHUB_WORKSPACE" --dest "$RUNNER_TEMP/particle-showcase" --brand kimi --single-brand
      - name: Validate the exported project
        working-directory: ${{ runner.temp }}/particle-showcase
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
